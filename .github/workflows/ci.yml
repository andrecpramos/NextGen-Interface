# WP-12 · CI. Gates the non-negotiable rules from PLAN.md §2 that a human
# reviewer cannot reliably check by eye.
#
# Node 24, not the `engines: >=20` in package.json. This repo runs TypeScript
# through `node` directly (`node scripts/build-registry.ts`, `node src/index.ts`,
# and eval/*.js importing ../src/config.ts) which needs unflagged type stripping
# (Node 23.6+), and packages/data needs `node:sqlite` (22.5+). On Node 20 the
# install succeeds and then everything fails at run time. See .claude/sdlc/ci-cd.md.
#
# Every install passes --ignore-scripts. pnpm 11 EXITS 1 on a fresh clone with
# ERR_PNPM_IGNORED_BUILDS (better-sqlite3, esbuild), and the onlyBuiltDependencies
# list in pnpm-workspace.yaml does NOT suppress it -- verified by reproducing a
# clean clone locally, and again with the list moved to package.json. A working
# checkout hides this because node_modules is already populated, so there are no
# builds left to ignore. Skipping the scripts is safe and was verified end to end:
# boundaries, typecheck, all 129 tests, registry:check, the floor eval and the
# scorecard gate all pass against an --ignore-scripts install. Nothing here needs
# a native build -- persistence is node:sqlite, not better-sqlite3, and vitest's
# esbuild resolves through platform-specific optional dependencies.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.1.2'

jobs:
  # Enforces the branching contract in CLAUDE.md: feature branches merge into
  # develop, and only develop reaches main. A PR into main from anything else is
  # a mistake, and a red check is a cheaper way to find out than a merge.
  guard-production:
    name: only develop may merge to main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PR targets 'main' from '${{ github.head_ref }}'. Production takes develop only — retarget this PR at 'develop'. See CLAUDE.md."
            exit 1
          fi
          echo "develop -> main. Release PR, allowed."

  verify:
    name: typecheck · test · registry · boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Rule 1 — core must never import a domain. Cheapest gate, run it first.
      - name: Import boundaries (Rule 1)
        run: node tooling/scripts/check-import-boundaries.mjs

      # Rule 15 — attacker-reachable content is fenced before it reaches a
      # prompt. The rule had no mechanism at all until 2026-09-10, which is how
      # it stayed this repo's top enforcement gap: the declaration sites said
      # "fence before this reaches a prompt" and there was no fence to call.
      #
      # This gate exists for the growth case rather than for regression. Nobody
      # deletes a fence; someone adds the fifth prompt-building site without
      # knowing the rule. It sees that a fence was applied near a prompt, not
      # that the fence covered the right value — see the script's header.
      - name: Prompt fencing (Rule 15)
        run: node tooling/scripts/check-prompt-fencing.mjs

      # Declared `blocking: true` in .claude/sdlc.config.json since that file was
      # written, run by /gates locally — and never run here. A PR with a broken
      # documentation link merged clean. Found 2026-09-10 by diffing the gate
      # list against this file, which CLAUDE.md says must not drift and had.
      #
      # `kit-sync` is deliberately still absent: it compares .claude/hooks
      # against sdlc-kit/runtime/hooks, and sdlc-kit is gitignored, so in a
      # fresh CI clone it has nothing to compare and skips.
      # Rule 2 — the model never computes a number the user sees. Guards the
      # model's *output schema*: a model that never emits a number cannot
      # compute one, whatever a render path later does. It does not check
      # arithmetic our own code performs on model output — that needs a
      # user-visible number to exist first, and none does yet.
      - name: Model numerics (Rule 2)
        run: node tooling/scripts/check-model-numerics.mjs

      # Rule 8 — the device is the source of truth. The product's claim is local
      # inference; one request to a remote host falsifies it for every adopter.
      # Loopback passes, and the asset manifest passes only where each URL is
      # pinned by sha256 — an allowlisted host with no hash would be a weaker
      # guarantee than that file appears to give.
      - name: Network egress (Rule 8)
        run: node tooling/scripts/check-network-egress.mjs

      - name: Documentation links resolve
        run: node tooling/scripts/check-doc-links.mjs

      - name: Typecheck
        run: pnpm -r typecheck

      # WP-26. The packages an adopter installs must be built JavaScript: Node
      # refuses to strip types inside node_modules, so a package whose `main` is
      # a .ts file installs cleanly and throws on the adopter's first import.
      # Every package here was `private: true` with a .ts entry point until
      # 2026-09-11, which made the product literally uninstallable.
      #
      # The build runs first because the gate reads built output — checking
      # entry points that were never emitted would pass vacuously.
      - name: Build the installable packages
        run: pnpm build

      - name: Packaging is importable (WP-26)
        run: node tooling/scripts/check-packaging.mjs

      - name: Unit tests
        run: pnpm -r test

      # Rule 10 — every capability ships >=3 examples. The builder exits
      # non-zero on a violation, and --check writes nothing.
      - name: Registry validation (Rule 10)
        run: pnpm registry:check

      # The generated artefacts must match what is committed. A registry built
      # from a changed definition but not regenerated is a silent drift.
      #
      # Scoped to the files the builder actually writes. A bare
      # `git diff --quiet` also trips on pnpm-lock.yaml, which pnpm rewrites
      # whenever any workspace manifest changed — an unrelated failure.
      #
      # Both domains are checked, in one job. Until WP-47 every domain build wrote
      # the same packages/core-intent/eval/registry.json, so running both here left
      # whichever ran last as the authoritative registry — which is why finance was
      # excluded. Each domain now writes its own
      # packages/domain-<name>/generated/registry.json (ADR-016), so the collision is
      # gone and this gate covers every domain rather than whichever one happened to
      # be authoritative.
      - name: Registry artefacts are current
        run: |
          pnpm registry:build
          pnpm registry:build:finance
          # --porcelain rather than `git diff --quiet`, deliberately: a domain whose
          # registry.json has never been committed produces an UNTRACKED file, and
          # git diff does not see untracked files. domain-finance was in exactly that
          # state when WP-47 moved the paths, so this gate would have gone vacuous
          # for the second time, in the same gate, by a different route.
          STALE=$(git status --porcelain -- packages/domain-modules/generated packages/domain-finance/generated)
          if [ -n "$STALE" ]; then
            echo "::error::Registry artefacts are stale or uncommitted. Rebuild both domains and commit the result."
            echo "$STALE"
            exit 1
          fi

      # Rule 14 — the shipped thresholds must be the calibrated ones. Nothing
      # reads the calibration output at run time, so without this the one edit
      # the rule forbids is also the one nothing notices.
      - name: Thresholds match their calibration (Rule 14)
        run: node tooling/scripts/check-thresholds.mjs

      # WP-46 — the artefacts a browser receives must follow their inputs. The
      # step above checks the reference registry's thresholds against their
      # calibration file. This one rebuilds what eval/fut-app/generated derives
      # (the per-role indexes and the per-registry thresholds) and replays the
      # browser's decisions against the server's. On 2026-09-11, a one-line change
      # to normalize() left ten shipped indexes stale while every job here stayed
      # green. Only a manual parity run noticed.
      - name: Derived artefacts are current (WP-46)
        run: node tooling/scripts/check-derived-artefacts.mjs

      # WP-45. Runs the BUILT bundle in a real DOM and audits every state a user
      # can reach. It found one real defect on its first run: focus fell to the
      # document body when an answer replaced the link the user was standing on.
      #
      # This is the automated half. Colour contrast comes back "incomplete" here
      # and not "pass" - jsdom computes no layout, and the widget paints in system
      # colours that belong to the user's OS. eval/a11y/NVDA-CHECKLIST.md is the
      # half a person runs, and the accessibility claim waits on it.
      - name: Accessibility - no serious or critical violations (WP-45)
        run: node tooling/scripts/check-accessibility.mjs

      # The model-free floor on the GENERATED registries. CI's golden-set job below
      # scores the reference app's set; nothing scored fut-app's, so a change to a
      # description, a trigger or normalize() could move what the router decides on
      # the app this is piloted on and no job would notice. That is what L9 cost
      # seven accuracy points. Deterministic (hashing, no stage 3) and ~0.3s, and
      # timing is excluded from the comparison so a busy runner cannot fail it.
      - name: Generated registries still decide the same way
        run: node --experimental-strip-types eval/fut-app/evaluate-golden.mjs --embedder hashing --check

  golden-set:
    name: golden-set regression (model-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Only the hashing + no-stage-3 run is deterministic and needs no Ollama,
      # so it is the only cascade configuration CI can gate on. The model-backed
      # runs (router:eval, router:baseline) need a local model server and are
      # left to the self-hosted path described in .claude/sdlc/ci-cd.md.
      - name: Preserve the committed baseline
        run: cp packages/core-intent/eval/scorecards/hashing-nostage3.json "$RUNNER_TEMP/baseline.json"

      # `|| true` is deliberate and is NOT silencing a failure. The floor run
      # exits 1 by design: with stage 3 disabled it cannot meet the absolute
      # accuracy targets, and is not meant to. What CI gates on is the
      # comparison against the committed baseline in the next step.
      - name: Run the deterministic floor
        run: pnpm router:floor || true

      - name: Regression + staleness gate
        run: |
          node tooling/scripts/check-scorecard.mjs \
            --baseline "$RUNNER_TEMP/baseline.json" \
            --current packages/core-intent/eval/scorecards/hashing-nostage3.json \
            --tolerance 0.05

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-hashing-nostage3
          path: packages/core-intent/eval/scorecards/hashing-nostage3.*
          retention-days: 14

  audit:
    name: dependency CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails the build on a high or critical advisory. Moderate and below are
      # reported without blocking — this is a solo-developer repo and a blocking
      # moderate would stop unrelated work.
      - name: Audit (high + critical block)
        run: pnpm audit --audit-level high

      - name: Full advisory report (never blocks)
        if: always()
        run: pnpm audit || true
