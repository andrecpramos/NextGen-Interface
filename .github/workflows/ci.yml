# CI. Gates the non-negotiable rules in docs/RULES.md that a human
# reviewer cannot reliably check by eye.
#
# Node 24, not the `engines: >=20` in package.json. This repo runs TypeScript
# through `node` directly (`node --experimental-strip-types eval/frameworks/…`, and the
# eval/*.js scripts importing ../src/config.ts), which needs type stripping (Node 23.6+
# unflagged). On Node 20 the install succeeds and then everything fails at run time. What an
# adopter runs is `adapter/scan.mjs`, a bundle with no TypeScript in it, and that is proved
# on Node 20 by `check-adapter.mjs`. See .claude/sdlc/ci-cd.md.
#
# Every install passes --ignore-scripts. pnpm 11 EXITS 1 on a fresh clone with
# ERR_PNPM_IGNORED_BUILDS (esbuild), and the onlyBuiltDependencies
# list in pnpm-workspace.yaml does NOT suppress it -- verified by reproducing a
# clean clone locally, and again with the list moved to package.json. A working
# checkout hides this because node_modules is already populated, so there are no
# builds left to ignore. Skipping the scripts is safe and was verified end to end:
# boundaries, typecheck, every test, registry:check, the floor eval and the scorecard
# gate all pass against an --ignore-scripts install. Nothing here needs a native
# build -- vitest's esbuild resolves through platform-specific optional dependencies.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.1.2'

jobs:
  # Enforces the branching contract in CLAUDE.md: feature branches merge into
  # develop, and only develop reaches main. A PR into main from anything else is
  # a mistake, and a red check is a cheaper way to find out than a merge.
  guard-production:
    name: only develop may merge to main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PR targets 'main' from '${{ github.head_ref }}'. Production takes develop only — retarget this PR at 'develop'. See CLAUDE.md."
            exit 1
          fi
          echo "develop -> main. Release PR, allowed."

  verify:
    name: typecheck · test · registry · boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Rule 1 — packages/core-* depend only on other core packages (ADR-021). Cheapest
      # gate, run it first.
      - name: Import boundaries (Rule 1)
        run: node tooling/scripts/check-import-boundaries.mjs

      # Rule 15 — attacker-reachable content is fenced before it reaches a
      # prompt. The rule had no mechanism at all until 2026-09-10, which is how
      # it stayed this repo's top enforcement gap: the declaration sites said
      # "fence before this reaches a prompt" and there was no fence to call.
      #
      # This gate exists for the growth case rather than for regression. Nobody
      # deletes a fence; someone adds the fifth prompt-building site without
      # knowing the rule. It sees that a fence was applied near a prompt, not
      # that the fence covered the right value — see the script's header.
      - name: Prompt fencing (Rule 15)
        run: node tooling/scripts/check-prompt-fencing.mjs

      # Declared `blocking: true` in .claude/sdlc.config.json since that file was
      # written, run by /gates locally — and never run here. A PR with a broken
      # documentation link merged clean. Found 2026-09-10 by diffing the gate
      # list against this file, which CLAUDE.md says must not drift and had.
      #
      # `kit-sync` is deliberately still absent: it compares .claude/hooks
      # against sdlc-kit/runtime/hooks, and sdlc-kit is gitignored, so in a
      # fresh CI clone it has nothing to compare and skips.
      # Rule 2 — the model never computes a number the user sees. Guards the
      # model's *output schema*: a model that never emits a number cannot
      # compute one, whatever a render path later does. It does not check
      # arithmetic our own code performs on model output — that needs a
      # user-visible number to exist first, and none does yet.
      - name: Model numerics (Rule 2)
        run: node tooling/scripts/check-model-numerics.mjs

      # Rule 8 — the device is the source of truth. The product's claim is local
      # inference; one request to a remote host falsifies it for every adopter.
      # Loopback passes, and the asset manifest passes only where each URL is
      # pinned by sha256 — an allowlisted host with no hash would be a weaker
      # guarantee than that file appears to give.
      - name: Network egress (Rule 8)
        run: node tooling/scripts/check-network-egress.mjs

      - name: Documentation links resolve
        run: node tooling/scripts/check-doc-links.mjs

      - name: Typecheck
        run: pnpm -r typecheck

      # The widget, built once: `adapter/runtime/nextgen.js` is this file byte for byte, and
      # the accessibility, strict-CSP and adapter gates below all read it. Reading a bundle
      # that was never built would pass vacuously, so the build comes first.
      #
      # Nothing else is built. Until ADR-021 this step compiled every package to `dist/` for
      # the tarballs an adopter used to install, and three gates (packaging, releasable,
      # installs-from-tarballs) checked the result. No adopter installs a package now; they
      # copy `adapter/`, and the two steps below are what prove that path.
      - name: Build the widget
        run: pnpm build

      # ADR-018's premise: an adopter copies `adapter/` into their repository and runs it,
      # with no package manager and no network. It is committed build output, so the first
      # step is that what is committed is what packages/ currently builds — an adopter
      # cannot regenerate it, and this repository has shipped stale committed artefacts
      # three times.
      - name: adapter/ is current
        run: node tooling/scripts/build-adapter.mjs --check

      # Then that the copy actually works. Every defect found while building the adapter
      # was a defect of the BUNDLE in a bare directory and invisible to every unit test:
      # a shebang on line 2, `Dynamic require is not supported`, a top-level await making
      # the module format ambiguous, `__filename is not defined` — and the one that
      # mattered, `build` resolving the widget through node_modules, which an adopter does
      # not have, so the bundle shipped with no assistant in it.
      - name: A copy of adapter/ runs with nothing installed (Rule 16)
        run: node tooling/scripts/check-adapter.mjs

      # ADR-017. kit and embed deliberately do not share the stage-3 config type
      # across the package boundary — kit has no DOM lib, embed's root is DOM-typed — so
      # this proves they still agree on the wire by making a real bundle interoperate
      # across a mocked network: off by default, on reaches the exact same-origin URL,
      # and an off-origin path in the manifest is refused before any fetch happens.
      - name: Stage-3 bundle reaches the transport that reads it back (Rule 8)
        run: node tooling/scripts/check-stage3.mjs

      - name: Unit tests
        run: pnpm -r test

      # Rule 10 — every capability ships >=3 examples, plus every other structural
      # rule validateRegistry() holds.
      #
      # Until ADR-018 this ran `domain-modules registry:build --check`: validation was a
      # side effect of building a domain package, and it therefore covered exactly one
      # registry of 7 capabilities. Both domain packages are deleted; the gate now finds
      # every registry committed to the tree by glob and validates all of them, so a
      # registry added under eval/ or adapter/ is covered the day it lands rather than
      # when someone remembers to add it to a list.
      - name: Registry validation (Rule 10)
        run: pnpm registry:check

      # Rule 14 — the shipped thresholds must be the calibrated ones. Nothing
      # reads the calibration output at run time, so without this the one edit
      # the rule forbids is also the one nothing notices.
      - name: Thresholds match their calibration (Rule 14)
        run: node tooling/scripts/check-thresholds.mjs

      # The artefacts a browser receives must follow their inputs. The
      # step above checks the reference registry's thresholds against their
      # calibration file. This one rebuilds what eval/frameworks/family/generated derives
      # (the per-role indexes and the per-registry thresholds) and replays the
      # browser's decisions against the server's. On 2026-09-11, a one-line change
      # to normalize() left ten shipped indexes stale while every job here stayed
      # green. Only a manual parity run noticed.
      # A fourth check joined this with ADR-020: an extracted rule's source
      # ("<file>:<line>") must still resolve against the fixture it names, proved the
      # same way — made to fail on purpose against a line past a real file's end.
      - name: Derived artefacts are current (ADR-020)
        run: node tooling/scripts/check-derived-artefacts.mjs

      # Runs the BUILT bundle in a real DOM and audits every state a user
      # can reach. It found one real defect on its first run: focus fell to the
      # document body when an answer replaced the link the user was standing on.
      #
      # This is the automated half. Colour contrast comes back "incomplete" here
      # and not "pass" - jsdom computes no layout, and the widget paints in system
      # colours that belong to the user's OS. eval/a11y/NVDA-CHECKLIST.md is the
      # half a person runs, and the accessibility claim waits on it.
      - name: Accessibility - no serious or critical violations
        run: node tooling/scripts/check-accessibility.mjs

      # The widget under a strict Content-Security-Policy, in headless Chrome (the
      # runner image has it). jsdom and the fake DOM enforce no policy, so until this
      # gate the widget rendered unstyled under `style-src 'self'` and the snippet
      # doctor printed never started under `script-src 'self'`, with every other
      # check green. Fails under CI if no browser is found: a skip protects nothing.
      - name: Strict Content-Security-Policy, in a real browser
        run: node tooling/scripts/check-csp.mjs

      # The model-free floor on the GENERATED registries. The router job scores the
      # frozen 7-capability fixture; this scores what the generator actually emits for
      # a whole application, so a change to a description, a trigger or normalize()
      # that moves what the router decides cannot pass unseen. An unseen change of
      # exactly that kind once cost seven accuracy points. Deterministic (hashing, no stage 3) and ~0.3s, and
      # timing is excluded from the comparison so a busy runner cannot fail it.
      - name: Generated registries still decide the same way
        run: node --experimental-strip-types eval/frameworks/evaluate-golden.mjs --embedder hashing --check

  golden-set:
    name: golden-set regression (model-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Only the hashing + no-stage-3 run is deterministic and needs no Ollama,
      # so it is the only cascade configuration CI can gate on. The model-backed
      # runs (router:eval, router:baseline) need a local model server and are
      # left to the self-hosted path described in .claude/sdlc/ci-cd.md.
      - name: Preserve the committed baseline
        run: cp packages/core-intent/eval/scorecards/hashing-nostage3.json "$RUNNER_TEMP/baseline.json"

      # No `|| true`. With stage 3 disabled the floor cannot meet the full
      # cascade's targets and is not meant to, so it reports them without
      # failing (--report-targets); it exits non-zero only on a crash or a
      # safety violation. Until 2026-10-02 this step ran with `|| true`, which
      # also hid a crash, and the next step then compared the committed
      # scorecard with itself and passed. That step now refuses a scorecard
      # that was not regenerated, too.
      - name: Run the deterministic floor
        run: pnpm router:floor

      - name: Regression + staleness gate
        run: |
          node tooling/scripts/check-scorecard.mjs \
            --baseline "$RUNNER_TEMP/baseline.json" \
            --current packages/core-intent/eval/scorecards/hashing-nostage3.json \
            --tolerance 0.05

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-hashing-nostage3
          path: packages/core-intent/eval/scorecards/hashing-nostage3.*
          retention-days: 14

  audit:
    name: dependency CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails the build on a high or critical advisory. Moderate and below are
      # reported without blocking — this is a solo-developer repo and a blocking
      # moderate would stop unrelated work.
      - name: Audit (high + critical block)
        run: pnpm audit --audit-level high

      - name: Full advisory report (never blocks)
        if: always()
        run: pnpm audit || true
