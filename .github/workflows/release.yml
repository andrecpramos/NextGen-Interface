# Release. Builds, verifies and attaches the adopter tarballs to a GitHub Release when a
# version tag is pushed. Nothing is published to a package registry.
#
# The tag must point at a commit on `main`: production is released from production, and
# a tag pushed from a feature branch fails here rather than shipping unreviewed code.
# `main` only moves when the owner asks for a release (CLAUDE.md), and its push already
# ran the whole of ci.yml — including the browser gates (CSP, accessibility) this job does
# not repeat. What this job does repeat is everything the tarballs themselves depend on:
# typecheck, tests, the build, packaging, and the install into a project outside this
# repository on Node 20 and current Node.
#
# The procedure is in .claude/sdlc/branching.md, "Releasing".

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.1.2'

jobs:
  release:
    name: build, verify and attach the tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Release from main only — see .claude/sdlc/branching.md."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # One version across every package, a dated CHANGELOG section, and the LICENSE in
      # each. Writes that section out as the release notes.
      - name: Version, tag, changelog and license agree
        run: node tooling/scripts/check-release.mjs --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Build the installable packages
        run: pnpm build

      - name: Packaging is importable
        run: node tooling/scripts/check-packaging.mjs

      - name: Installs from tarballs and runs on Node 20
        run: node tooling/scripts/check-install.mjs

      # Builds again and packs into release/, with SHA256SUMS.txt beside the tarballs.
      - name: Pack the tarballs
        run: pnpm pack:release

      - name: Attach them to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS.txt \
            --verify-tag \
            --title "NextGen $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
