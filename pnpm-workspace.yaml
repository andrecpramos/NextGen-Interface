packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'tooling/*'

# better-sqlite3 ships a prebuilt binary, so its build script is not needed here
# — but drizzle-kit's esbuild is, and pnpm blocks both by default. Declaring them
# explicitly is what stops `pnpm install` stopping to ask on a fresh clone.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
