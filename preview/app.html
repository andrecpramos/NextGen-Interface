<!doctype html>
<html lang="<!--LANG-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--> — Clube (preview)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; grid-template-columns: 248px 1fr;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6f8; color: #1d2330;
  }
  nav {
    position: sticky; top: 0; height: 100vh; overflow: auto;
    display: flex; flex-direction: column; gap: 2px; padding: 20px 12px;
    background: #fff; border-right: 1px solid #e3e6eb;
  }
  nav strong { padding: 4px 12px 18px; font-size: 17px; letter-spacing: -.01em; }
  nav a { padding: 8px 12px; border-radius: 8px; color: #4a5263; text-decoration: none; font-size: 14px; }
  nav a:hover { background: #f0f2f5; }
  nav a[aria-current="page"] { background: #e6f2f4; color: #1f6e7e; font-weight: 600; }
  /* Bench-only: not part of the mock app's chrome, so it is visibly set apart. */
  .bench-roles { margin: auto 0 0; padding: 12px 12px 0; border-top: 1px dashed #d7dbe2; font-size: 12px; }
  .bench-roles a { display: inline-block; padding: 3px 8px; font-size: 12px; }
  .bench-roles span { display: block; margin-top: 4px; }
  main { padding: 36px 44px; }
  .path { margin: 0; color: #6b7384; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
  h1 { margin: 4px 0 28px; font-size: 28px; letter-spacing: -.02em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { min-height: 132px; padding: 18px; background: #fff; border: 1px solid #e3e6eb; border-radius: 14px; }
  .card b { display: block; width: 45%; height: 12px; border-radius: 6px; background: #d9dde4; }
  .card i { display: block; height: 9px; margin-top: 12px; border-radius: 5px; background: #eceef2; }
  .card i:nth-of-type(2) { width: 82%; }
  .card i:nth-of-type(3) { width: 58%; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
    main { padding: 24px 16px; }
  }
</style>
</head>
<body data-role="<!--ROLE-->">
  <nav aria-label="Principal">
    <strong>Clube FC</strong>
      <!--NAV-->
    <p class="bench-roles">
      <a href="/bench?role=<!--ROLE-->">← bench</a>
      <span><!--ROLES--></span>
      <span aria-label="Page language"><!--LANGS--></span>
    </p>
  </nav>
  <main>
    <p class="path"><!--PATH--></p>
    <h1><!--TITLE--></h1>
    <div class="cards" aria-hidden="true">
      <div class="card"><b></b><i></i><i></i><i></i></div>
      <div class="card"><b></b><i></i><i></i><i></i></div>
      <div class="card"><b></b><i></i><i></i><i></i></div>
      <div class="card"><b></b><i></i><i></i><i></i></div>
      <div class="card"><b></b><i></i><i></i><i></i></div>
      <div class="card"><b></b><i></i><i></i><i></i></div>
    </div>
  </main>

  <script src="/nextgen.js"></script>
  <script src="/app.js"></script>
</body>
</html>
