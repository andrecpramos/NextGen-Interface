<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGen embed — phone preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9ebef; font: 14px/1.5 system-ui, sans-serif; color: #4a5263; }
  .device { width: 414px; height: 868px; padding: 12px; border-radius: 48px; background: #0d0f12; box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .5); }
  iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 36px; background: #fff; }
  p { margin: 16px 0 0; text-align: center; }
</style>
</head>
<body>
  <div>
    <div class="device"><iframe id="screen" title="Phone-sized preview"></iframe></div>
    <p>390 × 844 · <code id="src"></code> · add <code>?src=/calendar?open</code> to start elsewhere</p>
  </div>
  <script>
    // Only same-origin paths: this page must not become a way to frame somewhere else.
    const wanted = new URLSearchParams(location.search).get('src') || '/my';
    const src = wanted.startsWith('/') && !wanted.startsWith('//') ? wanted : '/my';
    document.getElementById('screen').src = src;
    document.getElementById('src').textContent = src;
  </script>
</body>
</html>
